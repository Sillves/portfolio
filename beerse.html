<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Voorstel</title>
<style>
:root{--color-fg:#2b2a27;--color-fg-muted:#6f6b63;--color-bg:#f7f5f1;--color-panel:#ffffff;--color-border-line:#e4e0d8;--color-bad:#b3261e;
--cds-gap-xs:.25rem;--cds-gap-sm:.5rem;--cds-gap-md:1rem;--cds-gap-lg:1.5rem;--cds-gap-xl:2.25rem;--cds-pad-xs:.375rem;--cds-pad-sm:.625rem;--cds-pad-md:1rem;--cds-pad-lg:1.25rem;--cds-radius:10px;
--cds-font-size-caption:.8125rem;--cds-font-size-body:1rem;--cds-font-size-heading:1.125rem;--cds-font-size-title:1.875rem;--cds-font-weight-medium:600;
--cds-chart-grid:#ece8e0;--cds-surface-popover:#ffffff;--cds-border:#e4e0d8;--cds-shadow-popover:0 4px 16px rgba(0,0,0,.12);--cds-text-secondary:#6f6b63;
--font-anthropic-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--font-anthropic-serif:Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root{--color-fg:#ece9e2;--color-fg-muted:#a8a39a;--color-bg:#1c1b19;--color-panel:#262522;--color-border-line:#3a3834;--color-bad:#f2b8b5;--cds-chart-grid:#35332f;--cds-surface-popover:#2e2c29;--cds-border:#3a3834;--cds-text-secondary:#a8a39a;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--color-bg);color:var(--color-fg);font-family:var(--font-anthropic-sans);line-height:1.5}
#app{padding:2rem max(16px,env(safe-area-inset-left,0px)) 3rem max(16px,env(safe-area-inset-right,0px))}
.gate{min-height:100vh;display:grid;place-items:center;padding:1rem}
.gate-box{width:100%;max-width:22rem;display:grid;gap:.75rem;background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:1.5rem}
.gate-box h1{font-family:var(--font-anthropic-serif);font-weight:400;font-size:1.5rem;margin:0}
.gate-box input{font:inherit;width:100%;padding:.625rem .75rem;border:1px solid var(--color-border-line);border-radius:var(--cds-radius);background:var(--color-bg);color:var(--color-fg)}
.gate-box button{font:inherit;padding:.625rem .75rem;border:0;border-radius:var(--cds-radius);background:var(--color-fg);color:var(--color-bg);cursor:pointer}
.gate-box button:disabled{opacity:.6;cursor:default}
.gate-msg{margin:0;min-height:1.25rem;font-size:.875rem;color:var(--color-bad)}
</style>
</head>
<body>
<main class="gate" id="gate">
  <form class="gate-box" id="form">
    <h1>Voorstel</h1>
    <label for="pw">Wachtwoord</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button id="go" type="submit">Openen</button>
    <p class="gate-msg" id="msg" role="alert"></p>
  </form>
</main>
<div id="app" hidden></div>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', hash: 'SHA-256', salt: b64(BLOB.salt), iterations: BLOB.iter}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(BLOB.iv)}, key, b64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function start(p) {
  const style = document.createElement('style');
  style.textContent = p.css;
  document.head.appendChild(style);
  const app = document.getElementById('app');
  app.innerHTML = p.html;
  document.getElementById('gate').hidden = true;
  app.hidden = false;
  document.title = 'Voorstel huis Beerse';
  const defaults = {...p.params};
  let params = {...defaults};
  const draws = new Map(), hooks = [];
  const render = () => {
    hooks.forEach((f) => f());
    draws.forEach((fn, name) => document.querySelectorAll(`[data-draw="${name}"]`).forEach((el) => fn(el)));
  };
  const dash = {
    colors: ['#2f6fb5', '#d9722b', '#4f9d69', '#8a63b8'],
    data: () => ({status: 'ok', data: p.rows}),
    params: () => params,
    setParams: (o) => { params = {...params, ...o}; render(); },
    resetParams: () => { params = {...defaults}; render(); },
    onData: (f) => { hooks.push(f); },
    draw: (name, fn) => { draws.set(name, fn); },
  };
  new Function('dash', 'd3', p.js)(dash, window.d3);
  render();
  let t;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(render, 120); });
}
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const go = document.getElementById('go'), msg = document.getElementById('msg');
  go.disabled = true; msg.textContent = '';
  try {
    start(await unlock(document.getElementById('pw').value));
  } catch (err) {
    msg.textContent = 'Dat wachtwoord klopt niet.';
    go.disabled = false;
  }
});
</script>

name: Voorstel API Test, Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'voorstel-api/**'
      - '.github/workflows/voorstel-api.yml'
  pull_request:
    paths:
      - 'voorstel-api/**'
      - '.github/workflows/voorstel-api.yml'
  workflow_dispatch:

# Builds na elkaar laten lopen: anders kan een oudere build als laatste 'latest' pushen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: rg.fr-par.scw.cloud
  NAMESPACE: amare-wedding
  IMAGE_NAME: voorstel-api

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tests
        working-directory: voorstel-api
        run: npm test

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Scaleway Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCALEWAY_SECRET_KEY }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: voorstel-api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=voorstel-api
          cache-to: type=gha,mode=max,scope=voorstel-api

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: SSH instellen
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # De service staat pas in compose.yaml na de merge in l-craft-infra; tot dan alleen het image pushen.
      - name: Deploy voorstel-api
        run: |
          ssh "deploy@$DEPLOY_HOST" 'if grep -q "^  voorstel-api:" /srv/l-craft/compose.yaml; then /srv/l-craft/deploy.sh voorstel-api; else echo "voorstel-api staat nog niet in compose.yaml, deploy overgeslagen"; fi'
